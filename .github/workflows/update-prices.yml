name: Update mandi prices
on:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Fetch AGMARKNET data
        env:
          AGMARKNET_API_KEY: ${{ secrets.AGMARKNET_API_KEY }}
        run: node scripts/fetch_prices.js
      - name: Commit public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/dates.json data/dates/
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "Update mandi prices"; git push; fi
