<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3a"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Kullu Mandi Prices</title></head><body><main class="app"><header><span>🌾</span><div><h1>Kullu Mandi Prices</h1><p>Today's prices · ₹/kg</p></div></header><section class="card controls"><div><strong>📅 Today</strong><span id="dateLabel"></span></div><label>Price<select id="priceType"><option value="modal">Modal</option><option value="min">Minimum</option><option value="max">Maximum</option></select></label><button id="updateBtn" class="primary">🔄 Update</button><button id="copyBtn" class="copy" disabled>📋 Copy WhatsApp Report</button></section><section class="card status"><strong id="status">⏳ Loading…</strong><small id="lastUpdated"></small></section><section class="card"><h2>MAIN KULLU PRICES</h2><textarea id="output" readonly aria-label="WhatsApp report"></textarea></section><section class="card debug"><details><summary>🔍 Data Verification</summary><pre id="debug"></pre></details></section><footer>📌 Source: AGMARKNET, Government of India<br>💰 Prices converted from ₹/quintal to ₹/kg</footer></main><script>document.getElementById("dateLabel").textContent=new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata",dateStyle:"long"}).format(new Date());</script><script src="app.js"></script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("service-worker.js");</script></body></html>
