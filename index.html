<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b3a"><meta name="description" content="Daily Kullu mandi prices from AGMARKNET">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>🌾 Kullu Mandi</title>
</head>
<body><main class="app">
<header><div class="logo">🌾</div><div><h1>Kullu Mandi</h1><p>Daily prices · ₹/kg</p></div></header>
<section class="card controls"><label>📅 Date<select id="dateSelect"><option value="latest">Latest available</option></select></label><button id="updateBtn" class="primary">🔄 Update Prices</button></section>
<section class="card status"><strong id="status">⏳ Loading prices…</strong><small id="lastUpdated"></small></section>
<section id="mainTable" class="card"><h2>Main Kullu Markets</h2><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<section id="comparison" class="card"><h2>🌍 Other Market Comparison</h2><div id="comparisonBody"></div></section>
<section class="actions"><button id="copyBtn" class="copy">📋 Copy WhatsApp</button><button id="posterBtn" class="poster">🖼️ Generate Poster</button><button id="shareBtn" class="share">📤 Share</button></section>
<section class="card report-card"><details><summary>WhatsApp report preview</summary><textarea id="report" readonly></textarea></details></section>
<footer>💰 Modal price shown · Converted from ₹/quintal<br>📌 Source: AGMARKNET, Govt. of India</footer>
</main>
<div id="posterModal" class="modal" aria-hidden="true"><div class="modal-card"><button class="close" id="closePoster">×</button><h2>🖼️ Price Poster</h2><canvas id="posterCanvas" width="1080" height="1350"></canvas><div class="modal-actions"><button id="downloadBtn">⬇️ Download PNG</button><button id="sharePosterBtn" class="share">📤 Share</button></div></div></div>
<script src="app.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');</script>
</body></html>
